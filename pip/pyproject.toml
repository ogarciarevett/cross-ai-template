[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cross-ai-template"
version = "0.1.0"
description = "Pull cross-ai-template updates into a downstream repo — a thin wrapper over scripts/update-from-template.sh (the POSIX shell is the brain)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Omar Garcia" }]
keywords = ["cross-ai-template", "agents", "template", "scaffold", "claude-code"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/ogarciarevett/cross-ai-template"
Repository = "https://github.com/ogarciarevett/cross-ai-template"

[project.scripts]
cross-ai-template = "cross_ai_template:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cross_ai_template"]
