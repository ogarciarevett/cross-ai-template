[package]
name = "cross-ai-template"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Pull cross-ai-template updates into a downstream repo — a thin wrapper over scripts/update-from-template.sh (the POSIX shell is the brain)."
license = "MIT"
repository = "https://github.com/ogarciarevett/cross-ai-template"
homepage = "https://github.com/ogarciarevett/cross-ai-template#readme"
keywords = ["agents", "template", "scaffold", "claude", "codegen"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cross-ai-template"
path = "src/main.rs"

[profile.release]
opt-level = "s"
strip = true
